name: Build Relay

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: relay-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build macOS arm64 package
    # Package.swift targets macOS 27; use the arm64 macOS 27 runner image
    # instead of macos-26, whose SDK cannot satisfy that deployment target.
    runs-on: xcode-27
    outputs:
      version: ${{ steps.version.outputs.marketing_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        shell: bash
        run: scripts/ci-version.sh >> "$GITHUB_OUTPUT"

      - name: Run offline regression checks
        run: scripts/test-regressions.sh

      - name: Build and package
        env:
          RELAY_VERSION: ${{ steps.version.outputs.marketing_version }}
          SWIFT_SCRATCH_PATH: ${{ runner.temp }}/relay-swift-build
        run: scripts/package-app.sh "$GITHUB_WORKSPACE/.build/package"

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: Relay-${{ steps.version.outputs.marketing_version }}-macos-arm64
          path: |
            .build/package/Relay-${{ steps.version.outputs.marketing_version }}-macos-arm64.zip
            .build/package/Relay-${{ steps.version.outputs.marketing_version }}-metadata.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v7
        with:
          name: Relay-${{ needs.build.outputs.version }}-macos-arm64
          path: .build/package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
        run: |
          # Tagged pushes keep their explicit tag. A main push gets a unique
          # version tag derived from the full commit count and is released as
          # soon as the package job succeeds.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            .build/package/Relay-*-macos-arm64.zip \
            .build/package/Relay-${{ needs.build.outputs.version }}-metadata.txt \
            --title "Relay $RELEASE_TAG" \
            --generate-notes
